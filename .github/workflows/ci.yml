name: Meson CI

on:
  push:
    branches:
      - master
      - feature
      - cibuilds
      - shadow-dark-phase1
  pull_request:
    branches:
      - master
      - feature
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows MSVC Release
            os: windows-latest
            msvc: true
            buildtype: release
            args: >-
              -Ddefault_library=static 
              --force-fallback-for=zlib,harfbuzz,freetype2,fribidi,libpng 
              -Dfreetype2:harfbuzz=disabled 
              -Dharfbuzz:freetype=disabled 
              -Dharfbuzz:cairo=disabled 
              -Dharfbuzz:glib=disabled 
              -Dharfbuzz:gobject=disabled
              -Dharfbuzz:tests=disabled
              -Dharfbuzz:docs=disabled
              -Dharfbuzz:icu=disabled
              -Dfribidi:tests=false
              -Dfribidi:docs=false
              -Dlibass:fontconfig=disabled
              -Davisynth=enabled
              -Dbestsource=enabled
              -Dvapoursynth=enabled
          - name: Windows MSVC Release (wx master)
            os: windows-latest
            msvc: true
            buildtype: release
            args: >-
              -Ddefault_library=static 
              --force-fallback-for=zlib,harfbuzz,freetype2,fribidi,libpng 
              -Dfreetype2:harfbuzz=disabled 
              -Dharfbuzz:freetype=disabled 
              -Dharfbuzz:cairo=disabled 
              -Dharfbuzz:glib=disabled 
              -Dharfbuzz:gobject=disabled
              -Dharfbuzz:tests=disabled
              -Dharfbuzz:docs=disabled
              -Dharfbuzz:icu=disabled
              -Dfribidi:tests=false
              -Dfribidi:docs=false
              -Dlibass:fontconfig=disabled
              -Davisynth=enabled
              -Dbestsource=enabled
              -Dvapoursynth=enabled
              -Dwx_version='3.3.0'
          #- {
          #  name: Windows MinGW,
          #  os: windows-latest,
          #  msvc: false
          #}
          - {
            name: Ubuntu Debug,
            os: ubuntu-latest,
            buildtype: debugoptimized,
            args: ''
          }
          - {
            name: Ubuntu Release,
            os: ubuntu-latest,
            buildtype: release,
            args: ''
          }
          - name: Ubuntu AppImage
            os: ubuntu-22.04
            buildtype: release
            appimage: true
            # distro ffms is currently broken
            args: >-
              --prefix=/usr
              -Dbuild_appimage=true
              -Ddefault_library=static
              --force-fallback-for=ffms2
              -Davisynth=enabled
              -Dbestsource=enabled
              -Dvapoursynth=enabled
          - {
            name: macOS Release,
            os: macos-latest,
            buildtype: release,
            args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true -Dvapoursynth=enabled --force-fallback-for=ffms2
          }

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Setup Meson
        run: |
          python -m pip install --upgrade pip setuptools
          pip install meson

      - name: Setup MSVC
        if: matrix.config.os == 'windows-latest' && matrix.config.msvc == true
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Windows)
        if: matrix.config.os == 'windows-latest'
        run: |
          choco install ninja innosetup pkgconfiglite
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path subprojects\freetype2.wrap)) { meson wrap install freetype2 }
          $url = "https://github.com/leafo/moonscript/releases/download/win32-v0.5.0/moonscript-187bac54ee5a7450013e9c38e005a0e671b76f45.zip"
          mkdir moonscript
          Invoke-WebRequest -Uri $url -OutFile ".\moonscript\moonscript.zip"
          cd moonscript
          7z e moonscript.zip
          Get-Location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies (MacOS)
        if: matrix.config.os == 'macos-latest'
        run: |
          brew update
          brew install luarocks ninja
          luarocks install luafilesystem 1.8.0
          luarocks install moonscript --dev
          brew install libass zlib ffms2 fftw hunspell
          brew install pulseaudio  # NO OpenAL in github CI

      - name: Install dependencies (Linux)
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build build-essential libx11-dev libwxgtk3.0-gtk3-dev libfreetype6-dev pkg-config libfontconfig1-dev libass-dev libasound2-dev libffms2-dev intltool libboost-all-dev libhunspell-dev libuchardet-dev libpulse-dev libopenal-dev libjansson-dev nasm

      - name: Configure
        run: meson setup build ${{ matrix.config.args }} -Dbuildtype=${{ matrix.config.buildtype }}

      - name: Patch iconv stdbool for modern MSVC
        if: matrix.config.os == 'windows-latest'
        shell: pwsh
        run: |
          $headers = @(
            "subprojects\iconv\include\stdbool.h",
            "build\subprojects\iconv\include\stdbool.h"
          )

          $safeHeader = @(
            "#ifndef _STDBOOL_H",
            "#define _STDBOOL_H",
            "#ifndef __cplusplus",
            "#ifndef bool",
            "#define bool int",
            "#endif",
            "#ifndef true",
            "#define true 1",
            "#endif",
            "#ifndef false",
            "#define false 0",
            "#endif",
            "#endif",
            "#define __bool_true_false_are_defined 1",
            "#endif",
            ""
          ) -join "`n"

          foreach ($h in $headers) {
            if (Test-Path $h) {
              Set-Content -Path $h -Value $safeHeader -NoNewline
              Write-Host "Patched $h"
              Get-Content $h
            }
          }
      - name: Patch FFMS2 for modern FFmpeg API
        if: matrix.config.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @(
            "subprojects\ffms2\src\core\videosource.cpp",
            "build\subprojects\ffms2\src\core\videosource.cpp"
          )

          $frameBlock = @(
            "    #ifdef AV_FRAME_FLAG_KEY",
            "    LocalFrame.KeyFrame = !!(Frame->flags & AV_FRAME_FLAG_KEY);",
            "    #else",
            "    LocalFrame.KeyFrame = Frame->key_frame;",
            "    #endif",
            "    LocalFrame.PictType = av_get_picture_type_char(Frame->pict_type);",
            "    LocalFrame.RepeatPict = Frame->repeat_pict;",
            "    #ifdef AV_FRAME_FLAG_INTERLACED",
            "    LocalFrame.InterlacedFrame = !!(Frame->flags & AV_FRAME_FLAG_INTERLACED);",
            "    #else",
            "    LocalFrame.InterlacedFrame = Frame->interlaced_frame;",
            "    #endif",
            "    #ifdef AV_FRAME_FLAG_TOP_FIELD_FIRST",
            "    LocalFrame.TopFieldFirst = !!(Frame->flags & AV_FRAME_FLAG_TOP_FIELD_FIRST);",
            "    #else",
            "    LocalFrame.TopFieldFirst = Frame->top_field_first;",
            "    #endif"
          ) -join "`n"

          $sideBlock = @(
            "        // Set stereoscopic 3d type",
            "        VP.Stereo3DType = FFMS_S3D_TYPE_2D;",
            "        VP.Stereo3DFlags = 0;",
            "",
            "        const AVStereo3D *StereoSideData = reinterpret_cast<const AVStereo3D *>(av_stream_get_side_data(FormatContext->streams[VideoTrack], AV_PKT_DATA_STEREO3D, nullptr));",
            "        if (StereoSideData) {",
            "            VP.Stereo3DType = StereoSideData->type;",
            "            VP.Stereo3DFlags = StereoSideData->flags;",
            "        }",
            "",
            "        const AVMasteringDisplayMetadata *MasteringDisplay = reinterpret_cast<const AVMasteringDisplayMetadata *>(av_stream_get_side_data(FormatContext->streams[VideoTrack], AV_PKT_DATA_MASTERING_DISPLAY_METADATA, nullptr));",
            "        if (MasteringDisplay) {",
            "            if (MasteringDisplay->has_primaries) {",
            "                VP.HasMasteringDisplayPrimaries = MasteringDisplay->has_primaries;",
            "                for (int i = 0; i < 3; i++) {",
            "                    VP.MasteringDisplayPrimariesX[i] = av_q2d(MasteringDisplay->display_primaries[i][0]);",
            "                    VP.MasteringDisplayPrimariesY[i] = av_q2d(MasteringDisplay->display_primaries[i][1]);",
            "                }",
            "                VP.MasteringDisplayWhitePointX = av_q2d(MasteringDisplay->white_point[0]);",
            "                VP.MasteringDisplayWhitePointY = av_q2d(MasteringDisplay->white_point[1]);",
            "            }",
            "            if (MasteringDisplay->has_luminance) {",
            "                VP.HasMasteringDisplayLuminance = MasteringDisplay->has_luminance;",
            "                VP.MasteringDisplayMinLuminance = av_q2d(MasteringDisplay->min_luminance);",
            "                VP.MasteringDisplayMaxLuminance = av_q2d(MasteringDisplay->max_luminance);",
            "            }",
            "",
            "            VP.HasMasteringDisplayPrimaries = !!VP.MasteringDisplayPrimariesX[0] && !!VP.MasteringDisplayPrimariesY[0] &&",
            "                                          !!VP.MasteringDisplayPrimariesX[1] && !!VP.MasteringDisplayPrimariesY[1] &&",
            "                                          !!VP.MasteringDisplayPrimariesX[2] && !!VP.MasteringDisplayPrimariesY[2] &&",
            "                                          !!VP.MasteringDisplayWhitePointX   && !!VP.MasteringDisplayWhitePointY;",
            "            VP.HasMasteringDisplayLuminance = !!VP.MasteringDisplayMaxLuminance;",
            "        }",
            "",
            "        const AVContentLightMetadata *ContentLightLevel = reinterpret_cast<const AVContentLightMetadata *>(av_stream_get_side_data(FormatContext->streams[VideoTrack], AV_PKT_DATA_CONTENT_LIGHT_LEVEL, nullptr));",
            "        if (ContentLightLevel) {",
            "            VP.ContentLightLevelMax = ContentLightLevel->MaxCLL;",
            "            VP.ContentLightLevelAverage = ContentLightLevel->MaxFALL;",
            "            VP.HasContentLightLevel = !!VP.ContentLightLevelMax || !!VP.ContentLightLevelAverage;",
            "        }",
            "",
            "        // Set rotation"
          ) -join "`n"

          foreach ($file in $files) {
            if (!(Test-Path $file)) { continue }

            $t = Get-Content $file -Raw
            $before = $t

            $t = [regex]::Replace(
              $t,
              "    LocalFrame\.KeyFrame = Frame->key_frame;\r?\n    LocalFrame\.PictType = av_get_picture_type_char\(Frame->pict_type\);\r?\n    LocalFrame\.RepeatPict = Frame->repeat_pict;\r?\n    LocalFrame\.InterlacedFrame = Frame->interlaced_frame;\r?\n    LocalFrame\.TopFieldFirst = Frame->top_field_first;",
              $frameBlock
            )

            $t = [regex]::Replace(
              $t,
              "(?s)        // Set stereoscopic 3d type.*?        // Set rotation",
              $sideBlock
            )

            if ($t -ne $before) {
              Set-Content -Path $file -Value $t -NoNewline
              Write-Host "Patched FFMS2 source: $file"
            } else {
              Write-Host "No FFMS2 patch needed or pattern not found: $file"
            }
          }
      - name: Build
        run: meson compile -C build
      - name: Run test
        run: meson test -C build --verbose "gtest main"

      # Windows artifacts
      - name: Generate Windows installer
        if: matrix.config.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          meson compile win-installer -C build

      - name: Generate Windows portable installer
        if: matrix.config.os == 'windows-latest'
        run: cd build && ninja win-portable

      - name: Upload artifacts - win_installer
        uses: actions/upload-artifact@v4
        if: matrix.config.os == 'windows-latest'
        with:
          name: ${{ matrix.config.name }} - installer
          path: build/Aegisub-*.exe
          if-no-files-found: error
      
      - name: Upload artifacts - portable.zip
        uses: actions/upload-artifact@v4
        if: matrix.config.os == 'windows-latest'
        with:
          name: ${{ matrix.config.name }} - portable
          path: build/aegisub-portable-64.zip
      
      # macOS artifacts
      - name: Generate macOS installer
        if: matrix.config.os == 'macos-latest'
        run: |
          meson compile osx-bundle -C build
          meson compile osx-build-dmg -C build

      - name: Upload artifacts - macOS dmg
        uses: actions/upload-artifact@v4
        if: matrix.config.os == 'macos-latest'
        with:
          name: ${{ matrix.config.name }} - installer
          path: build/Aegisub-*.dmg
          if-no-files-found: error

      # Linux artifacts (AppImage)
      - name: Generate AppImage
        if: matrix.config.appimage
        run: |
          mkdir -p appimage/appdir
          meson install -C build --destdir=../appimage/appdir

          cd appimage
          sudo apt-get install libfuse2
          curl -L "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20220822-1/linuxdeploy-x86_64.AppImage" -o linuxdeploy
          curl -L "https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x linuxdeploy appimagetool

          ./linuxdeploy --appdir appdir --desktop-file=appdir/aegisub.desktop
          ./appimagetool appdir

      - name: Upload artifacts - Linux AppImage
        uses: actions/upload-artifact@v4
        if: matrix.config.appimage
        with:
          name: ${{ matrix.config.name }}
          path: appimage/*.AppImage
          if-no-files-found: error
